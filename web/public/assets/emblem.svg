<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="facetNavyCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162F" />
      <stop offset="100%" stop-color="#145BD7" />
    </linearGradient>
    <linearGradient id="facetElectricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287BFF" />
      <stop offset="100%" stop-color="#16D9F5" />
    </linearGradient>
    <linearGradient id="facetChampagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <linearGradient id="facetGoldSheen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FC" />
      <stop offset="50%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <filter id="prismaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Hexagon / Shield outline subtle -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
           fill="#07162F" stroke="url(#facetElectricCyan)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Inner Crystalline Facets forming the 'B' Emblem and Insight Eye -->
  
  <!-- Left Spine: Solid Vertical Facets -->
  <polygon points="28,24 44,24 44,60 28,60" fill="url(#facetNavyCobalt)" />
  <polygon points="28,60 44,60 44,96 28,96" fill="#0B2044" />
  <polygon points="28,24 36,16 44,24 28,24" fill="url(#facetElectricCyan)" />
  <polygon points="28,96 36,104 44,96 28,96" fill="url(#facetChampagneGold)" />

  <!-- Upper Loop Facets of 'B' -->
  <polygon points="44,24 76,24 88,38 76,56 44,56" fill="url(#facetElectricCyan)" />
  <polygon points="50,32 72,32 78,40 70,50 50,50" fill="#07162F" stroke="url(#facetElectricCyan)" stroke-width="1" />
  
  <!-- Lower Loop Facets of 'B' (Larger, Dimensional) -->
  <polygon points="44,56 78,56 94,72 82,96 44,96" fill="url(#facetNavyCobalt)" />
  <polygon points="50,64 74,64 84,74 76,88 50,88" fill="#0B2044" stroke="url(#facetChampagneGold)" stroke-width="1" />

  <!-- Central Prismatic Core / The "Basirah" Insight Jewel (Hexagonal refraction in cyan & gold) -->
  <polygon points="44,52 64,44 76,56 64,68 44,60" fill="url(#facetChampagneGold)" opacity="0.95" filter="url(#prismaticGlow)" />
  <circle cx="60" cy="56" r="3.5" fill="#FFFFFF" />

  <!-- Refraction Highlights & Specular Vectors -->
  <polygon points="76,24 88,38 78,40 68,28" fill="url(#facetGoldSheen)" opacity="0.8" />
  <polygon points="78,56 94,72 84,74 74,60" fill="url(#facetElectricCyan)" opacity="0.7" />
  <polygon points="82,96 94,72 78,74" fill="url(#facetChampagneGold)" opacity="0.6" />

  <!-- Delicate Quantum Orbit Rings -->
  <ellipse cx="60" cy="60" rx="48" ry="18" fill="none" stroke="#16D9F5" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4" transform="rotate(-25 60 60)" />
</svg>
