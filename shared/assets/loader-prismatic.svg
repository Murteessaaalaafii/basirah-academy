<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="loadCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145BD7" />
      <stop offset="100%" stop-color="#16D9F5" />
    </linearGradient>
    <linearGradient id="loadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <style>
      @keyframes spinClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .orbit-1 { transform-origin: 50px 50px; animation: spinClockwise 4s linear infinite; }
      .orbit-2 { transform-origin: 50px 50px; animation: spinCounter 6s linear infinite; }
      .center-core { transform-origin: 50px 50px; animation: pulseGlow 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Orbit Track -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#0B2044" stroke-width="2" />
  
  <!-- Outer Rotating Prismatic Ring -->
  <g class="orbit-1">
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#loadCyan)" stroke-width="2.5" stroke-dasharray="60, 180" stroke-linecap="round" />
    <circle cx="50" cy="8" r="4" fill="#16D9F5" />
  </g>

  <!-- Inner Counter-Rotating Hexagon Ring -->
  <g class="orbit-2">
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="url(#loadGold)" stroke-width="1.8" stroke-dasharray="30, 90" stroke-linecap="round" />
    <circle cx="78" cy="34" r="3" fill="#D9A83F" />
    <circle cx="22" cy="66" r="3" fill="#D9A83F" />
  </g>

  <!-- Center Prismatic Jewel -->
  <g class="center-core">
    <polygon points="50,35 63,42 63,58 50,65 37,58 37,42" fill="#07162F" stroke="#16D9F5" stroke-width="1.5" />
    <polygon points="50,40 58,45 58,55 50,60 42,55 42,45" fill="url(#loadCyan)" />
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
  </g>
</svg>

