  <!-- Floating Empty Cube / Empty Vector Box -->
  <polygon points="160,75 195,95 160,115 125,95" fill="#0B2044" stroke="url(#empCyan)" stroke-width="1.5" />
  <polygon points="125,95 160,115 160,155 125,135" fill="#07162F" stroke="url(#empCyan)" stroke-width="1.5" />
  <polygon points="160,115 195,95 195,135 160,155" fill="#145BD7" opacity="0.5" stroke="url(#empCyan)" stroke-width="1.5" />
  <!-- Floating Sparkles -->
  <circle cx="190" cy="70" r="2" fill="#D9A83F" />
  <circle cx="130" cy="145" r="2.5" fill="#16D9F5" />
  <circle cx="210" cy="120" r="1.5" fill="#F4F7FC" />
  <text x="160" y="205" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#F4F7FC">No Records Found</text>
  <text x="160" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#91A4C1">Your queries or submissions will appear here.</text>
</svg>

