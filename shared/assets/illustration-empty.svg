<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="empCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145BD7" />
      <stop offset="100%" stop-color="#16D9F5" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="160" cy="110" r="75" fill="#0B2044" opacity="0.6" />
  <!-- Subtle Blueprint Hexagonal Ring -->
