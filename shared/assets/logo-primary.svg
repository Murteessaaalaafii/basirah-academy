<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pPrimNavyCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162F" />
      <stop offset="100%" stop-color="#145BD7" />
    </linearGradient>
    <linearGradient id="pPrimElectricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287BFF" />
      <stop offset="100%" stop-color="#16D9F5" />
    </linearGradient>
    <linearGradient id="pPrimChampagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <linearGradient id="goldTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9A83F" />
      <stop offset="50%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group (left) -->
  <g transform="translate(10, 10) scale(0.83)">
    <!-- Shield / Prismatic Frame -->
    <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
             fill="#0B2044" stroke="url(#pPrimElectricCyan)" stroke-width="1.8" stroke-opacity="0.4" />
    
    <!-- Vertical Spine -->
    <polygon points="28,24 44,24 44,60 28,60" fill="url(#pPrimNavyCobalt)" />
    <polygon points="28,60 44,60 44,96 28,96" fill="#07162F" />
    <polygon points="28,24 36,16 44,24" fill="url(#pPrimElectricCyan)" />
    <polygon points="28,96 36,104 44,96" fill="url(#pPrimChampagneGold)" />

    <!-- Top Loop -->
    <polygon points="44,24 76,24 88,38 76,56 44,56" fill="url(#pPrimElectricCyan)" />
    <polygon points="50,32 72,32 78,40 70,50 50,50" fill="#07162F" stroke="url(#pPrimElectricCyan)" stroke-width="1" />

    <!-- Bottom Loop -->
    <polygon points="44,56 78,56 94,72 82,96 44,96" fill="url(#pPrimNavyCobalt)" />
    <polygon points="50,64 74,64 84,74 76,88 50,88" fill="#0B2044" stroke="url(#pPrimChampagneGold)" stroke-width="1" />

    <!-- Insight Core -->
    <polygon points="44,52 64,44 76,56 64,68 44,60" fill="url(#pPrimChampagneGold)" opacity="0.95" filter="url(#pGlow)" />
    <circle cx="60" cy="56" r="3" fill="#FFFFFF" />

    <!-- Quantum Orbit -->
    <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="#16D9F5" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4" transform="rotate(-25 60 60)" />
  </g>

  <!-- Typography Group (right) -->
  <g transform="translate(125, 30)">
    <!-- Brand Name: BASIRAH -->
    <text x="0" y="32" 
          font-family="Space Grotesk, sans-serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="1.5" 
          fill="#F4F7FC">
      BASIRAH
    </text>
    
    <!-- ACADEMY (Gold Accent) -->
    <text x="162" y="32" 
          font-family="Space Grotesk, sans-serif" 
          font-size="34" 
          font-weight="300" 
          letter-spacing="2" 
          fill="url(#goldTextGradient)">
      ACADEMY
    </text>

    <!-- Micro Separator / Laser Line -->
    <line x1="0" y1="44" x2="310" y2="44" stroke="url(#pPrimElectricCyan)" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="160" cy="44" r="2" fill="#16D9F5" />

    <!-- Tagline: LEARN • BUILD • INNOVATE -->
    <text x="1" y="62" 
          font-family="IBM Plex Mono, monospace" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="3.8" 
          fill="#91A4C1">
      LEARN <tspan fill="#16D9F5">•</tspan> BUILD <tspan fill="#D9A83F">•</tspan> INNOVATE
    </text>
  </g>
</svg>

