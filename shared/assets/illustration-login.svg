<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="illBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162F" />
      <stop offset="100%" stop-color="#0B2044" />
    </linearGradient>
    <linearGradient id="illCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#287BFF" />
      <stop offset="100%" stop-color="#16D9F5" />
    </linearGradient>
    <linearGradient id="illGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D18B" />
      <stop offset="100%" stop-color="#D9A83F" />
    </linearGradient>
    <radialGradient id="illCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16D9F5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07162F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="600" height="500" rx="20" fill="url(#illBg)" />
  <circle cx="300" cy="250" r="220" fill="url(#illCenterGlow)" />

  <!-- Architectural Neural Coordinates / Grid Lines -->
  <g stroke="#145BD7" stroke-width="0.7" opacity="0.3">
    <line x1="50" y1="250" x2="550" y2="250" />
    <line x1="300" y1="50" x2="300" y2="450" />
    <circle cx="300" cy="250" r="90" fill="none" stroke-dasharray="4,4" />
    <circle cx="300" cy="250" r="160" fill="none" stroke-dasharray="2,6" />
  </g>

  <!-- Crystalline Neural Lattice Connections -->
  <g stroke="url(#illCyan)" stroke-width="1.2" opacity="0.7">
    <line x1="300" y1="130" x2="420" y2="200" />
    <line x1="420" y1="200" x2="400" y2="340" />
    <line x1="400" y1="340" x2="300" y2="380" />
    <line x1="300" y1="380" x2="180" y2="320" />
    <line x1="180" y1="320" x2="170" y2="190" />
    <line x1="170" y1="190" x2="300" y2="130" />
    <!-- Cross Struts -->
    <line x1="300" y1="130" x2="300" y2="250" stroke="#D9A83F" stroke-width="1.5" />
    <line x1="420" y1="200" x2="300" y2="250" />
    <line x1="170" y1="190" x2="300" y2="250" />
    <line x1="180" y1="320" x2="300" y2="250" />
    <line x1="400" y1="340" x2="300" y2="250" stroke="#D9A83F" stroke-width="1.5" />
  </g>

  <!-- Floating Crystal Nodes -->
  <g>
    <!-- Node 1: Top -->
    <circle cx="300" cy="130" r="8" fill="#07162F" stroke="#16D9F5" stroke-width="2" />
    <circle cx="300" cy="130" r="3" fill="#16D9F5" />
    <!-- Node 2: Top Right -->
    <circle cx="420" cy="200" r="7" fill="#07162F" stroke="#D9A83F" stroke-width="2" />
    <circle cx="420" cy="200" r="2.5" fill="#F2D18B" />
    <!-- Node 3: Bottom Right -->
    <circle cx="400" cy="340" r="9" fill="#07162F" stroke="#16D9F5" stroke-width="2" />
    <circle cx="400" cy="340" r="3.5" fill="#16D9F5" />
    <!-- Node 4: Bottom -->
    <circle cx="300" cy="380" r="7" fill="#07162F" stroke="#D9A83F" stroke-width="2" />
    <circle cx="300" cy="380" r="2.5" fill="#D9A83F" />
    <!-- Node 5: Bottom Left -->
    <circle cx="180" cy="320" r="8" fill="#07162F" stroke="#16D9F5" stroke-width="2" />
    <circle cx="180" cy="320" r="3" fill="#16D9F5" />
    <!-- Node 6: Top Left -->
    <circle cx="170" cy="190" r="7" fill="#07162F" stroke="#D9A83F" stroke-width="2" />
    <circle cx="170" cy="190" r="2.5" fill="#F2D18B" />
  </g>

  <!-- Central Prismatic Emblem -->
  <g transform="translate(260, 210) scale(0.67)">
    <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" fill="#0B2044" stroke="#16D9F5" stroke-width="2" />
    <polygon points="28,24 44,24 44,60 28,60" fill="#145BD7" />
    <polygon points="44,24 76,24 88,38 76,56 44,56" fill="url(#illCyan)" />
    <polygon points="44,56 78,56 94,72 82,96 44,96" fill="#145BD7" />
    <polygon points="44,52 64,44 76,56 64,68 44,60" fill="url(#illGold)" />
    <circle cx="60" cy="56" r="4" fill="#FFFFFF" />
  </g>

  <!-- Data Stream Labels -->
  <text x="316" y="134" font-family="IBM Plex Mono, monospace" font-size="10" fill="#16D9F5" opacity="0.8">TENSOR_CORE::INIT</text>
  <text x="432" y="204" font-family="IBM Plex Mono, monospace" font-size="10" fill="#D9A83F" opacity="0.8">RAG_INDEX::READY</text>
  <text x="100" y="194" font-family="IBM Plex Mono, monospace" font-size="10" fill="#91A4C1" opacity="0.8">ATTENTION_HEAD</text>
  <text x="415" y="344" font-family="IBM Plex Mono, monospace" font-size="10" fill="#16D9F5" opacity="0.8">EMBEDDING_SPACE</text>
</svg>

